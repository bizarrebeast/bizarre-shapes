<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Bizarre Shapes — BizarreBeasts Learning Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cw, ch;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  cw = innerWidth * d; ch = innerHeight * d;
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  if (gameState === 'playing') layoutLevel();
}
addEventListener('resize', resize); resize();

let gameState = 'title', level = 1, score = 0, streak = 0;
let pieces = [], slots = [], dragPiece = null, dragOff = {x:0,y:0};
let feedTimer = 0, feedType = '', feedText = '', particles = [];
let totalSlots = 0, filledSlots = 0;

const SHAPE_DEFS = [
  { name: 'Circle', draw: (x,y,s,c) => { ctx.beginPath(); ctx.arc(x,y,s*0.4,0,Math.PI*2); ctx.fill(); ctx.stroke(); }},
  { name: 'Square', draw: (x,y,s,c) => { const h=s*0.35; ctx.beginPath(); ctx.rect(x-h,y-h,h*2,h*2); ctx.fill(); ctx.stroke(); }},
  { name: 'Triangle', draw: (x,y,s,c) => { const h=s*0.4; ctx.beginPath(); ctx.moveTo(x,y-h); ctx.lineTo(x+h,y+h*0.7); ctx.lineTo(x-h,y+h*0.7); ctx.closePath(); ctx.fill(); ctx.stroke(); }},
  { name: 'Star', draw: (x,y,s,c) => { const r=s*0.4,ri=r*0.4; ctx.beginPath(); for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rad=i%2===0?r:ri;ctx.lineTo(x+rad*Math.cos(a),y+rad*Math.sin(a));}ctx.closePath();ctx.fill();ctx.stroke();}},
  { name: 'Diamond', draw: (x,y,s,c) => { const w=s*0.3,h=s*0.4; ctx.beginPath(); ctx.moveTo(x,y-h); ctx.lineTo(x+w,y); ctx.lineTo(x,y+h); ctx.lineTo(x-w,y); ctx.closePath(); ctx.fill(); ctx.stroke(); }},
  { name: 'Hexagon', draw: (x,y,s,c) => { const r=s*0.38; ctx.beginPath(); for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}ctx.closePath();ctx.fill();ctx.stroke();}},
  { name: 'Pentagon', draw: (x,y,s,c) => { const r=s*0.38; ctx.beginPath(); for(let i=0;i<5;i++){const a=i*2*Math.PI/5-Math.PI/2;ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}ctx.closePath();ctx.fill();ctx.stroke();}},
  { name: 'Oval', draw: (x,y,s,c) => { ctx.beginPath(); ctx.ellipse(x,y,s*0.45,s*0.28,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); }},
];

const PIECE_COLORS = ['#E74C3C','#3498DB','#F1C40F','#27AE60','#E67E22','#9B59B6','#E91E8C','#00D4AA'];

const LEVELS = [
  { count: 3 }, { count: 4 }, { count: 5 }, { count: 6 }, { count: 8 },
];

function clamp(lo,v,hi){return Math.max(lo,Math.min(hi,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOutBack(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}

function layoutLevel() {
  const def = LEVELS[Math.min(level-1,LEVELS.length-1)];
  const n = def.count;
  totalSlots = n; filledSlots = 0;
  slots = []; pieces = []; dragPiece = null;

  const size = Math.min(cw,ch) * 0.11;
  const slotArea = { top: ch*0.08, bottom: ch*0.55, left: cw*0.05, right: cw*0.95 };
  const pieceArea = { top: ch*0.62, bottom: ch*0.92, left: cw*0.05, right: cw*0.95 };

  // Place slots (outlines) in a grid
  const cols = Math.min(n, 4);
  const rows = Math.ceil(n / cols);
  const slotSpaceW = (slotArea.right - slotArea.left) / cols;
  const slotSpaceH = (slotArea.bottom - slotArea.top) / rows;

  const shapeIndices = [];
  for (let i = 0; i < n; i++) shapeIndices.push(i % SHAPE_DEFS.length);

  for (let i = 0; i < n; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    slots.push({
      x: slotArea.left + slotSpaceW * (col + 0.5),
      y: slotArea.top + slotSpaceH * (row + 0.5),
      shape: SHAPE_DEFS[shapeIndices[i]],
      shapeIdx: shapeIndices[i],
      size, filled: false,
      color: PIECE_COLORS[shapeIndices[i]],
    });
  }

  // Scatter pieces randomly in piece area
  const pieceCols = Math.min(n, 4);
  const pieceSpaceW = (pieceArea.right - pieceArea.left) / pieceCols;
  const shuffled = [...shapeIndices];
  for (let i = shuffled.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }

  for (let i = 0; i < n; i++) {
    const col = i % pieceCols, row = Math.floor(i / pieceCols);
    const px = pieceArea.left + pieceSpaceW * (col + 0.5) + (Math.random()-0.5)*size*0.3;
    const py = pieceArea.top + (pieceArea.bottom-pieceArea.top) * (row+0.5) / Math.ceil(n/pieceCols) + (Math.random()-0.5)*size*0.2;
    pieces.push({
      x: px, y: py, homeX: px, homeY: py,
      shapeIdx: shuffled[i], shape: SHAPE_DEFS[shuffled[i]],
      color: PIECE_COLORS[shuffled[i]],
      size, placed: false,
      enterTime: 0, enterDelay: i * 0.06,
      rotation: (Math.random()-0.5)*0.2,
      wobble: Math.random()*Math.PI*2,
    });
  }
}

function startLevel(l) {
  level = l; streak = 0; feedTimer = 0;
  layoutLevel();
  gameState = 'playing';
}

// Input
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX-r.left)*cw/r.width, y: (e.clientY-r.top)*ch/r.height };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = getPos(e);
  if (gameState === 'title') { startLevel(1); return; }
  if (gameState === 'levelComplete') { level < LEVELS.length ? startLevel(level+1) : (gameState='gameComplete'); return; }
  if (gameState === 'gameComplete') { level=1; score=0; gameState='title'; return; }
  if (gameState !== 'playing') return;

  for (let i = pieces.length-1; i >= 0; i--) {
    const pc = pieces[i];
    if (pc.placed) continue;
    if (Math.hypot(p.x-pc.x, p.y-pc.y) < pc.size*0.5) {
      dragPiece = pc; dragOff.x = pc.x-p.x; dragOff.y = pc.y-p.y;
      pieces.splice(i,1); pieces.push(pc);
      return;
    }
  }
});

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!dragPiece) return;
  const p = getPos(e);
  dragPiece.x = p.x + dragOff.x;
  dragPiece.y = p.y + dragOff.y;
});

canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  if (!dragPiece) return;

  // Check slot match
  let matched = false;
  for (const slot of slots) {
    if (slot.filled) continue;
    if (Math.hypot(dragPiece.x-slot.x, dragPiece.y-slot.y) < slot.size*0.6) {
      if (dragPiece.shapeIdx === slot.shapeIdx) {
        // Correct!
        slot.filled = true;
        dragPiece.placed = true;
        dragPiece.x = slot.x; dragPiece.y = slot.y;
        dragPiece.rotation = 0;
        streak++; const pts = 10*Math.min(streak,5); score += pts;
        filledSlots++;
        feedType='correct'; feedText=`+${pts}`; feedTimer=0.6;
        spawnStars(slot.x, slot.y, dragPiece.color);
        if (filledSlots >= totalSlots) {
          setTimeout(() => {
            gameState = 'levelComplete';
            spawnStars(cw/2,ch/2,'#FFD700');
            spawnStars(cw*0.3,ch*0.4,'#FF69B4');
            spawnStars(cw*0.7,ch*0.4,'#00D4AA');
          }, 300);
        }
        matched = true;
      } else {
        // Wrong slot
        streak = 0;
        feedType='wrong'; feedText='Wrong shape!'; feedTimer=0.5;
        dragPiece.snapBack = true; dragPiece.snapFrom = {x:dragPiece.x,y:dragPiece.y}; dragPiece.snapT = 0;
        matched = true;
      }
      break;
    }
  }
  if (!matched) {
    dragPiece.snapBack = true; dragPiece.snapFrom = {x:dragPiece.x,y:dragPiece.y}; dragPiece.snapT = 0;
  }
  dragPiece = null;
});

canvas.addEventListener('pointercancel', () => {
  if (dragPiece) { dragPiece.snapBack=true; dragPiece.snapFrom={x:dragPiece.x,y:dragPiece.y}; dragPiece.snapT=0; dragPiece=null; }
});

function spawnStars(sx,sy,color) {
  for(let i=0;i<8;i++) particles.push({x:sx,y:sy,vx:(Math.random()-0.5)*cw*0.4,vy:(Math.random()-0.8)*ch*0.3,size:6+Math.random()*10,color,life:1});
}

// Drawing
function drawBg() {
  const g = ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#1a1a2e'); g.addColorStop(0.5,'#16213e'); g.addColorStop(1,'#0f3460');
  ctx.fillStyle = g; ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
  for(let x=0;x<cw;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
  for(let y=0;y<ch;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();}
}

function drawSlots() {
  slots.forEach(s => {
    if (s.filled) return;
    ctx.save();
    ctx.setLineDash([8,6]);
    ctx.strokeStyle = s.color + '60';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'transparent';
    s.shape.draw(s.x, s.y, s.size);
    ctx.setLineDash([]);
    // Label
    const fs = clamp(9,s.size*0.2,14);
    ctx.font = `${fs}px Slackey`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(s.shape.name, s.x, s.y + s.size*0.55);
    ctx.restore();
  });
}

function drawPieces(dt) {
  const now = Date.now();
  pieces.forEach(pc => {
    if (pc.placed && pc !== dragPiece) {
      // Draw in place
      ctx.save();
      ctx.fillStyle = pc.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
      pc.shape.draw(pc.x, pc.y, pc.size);
      ctx.restore();
      return;
    }
    if (pc.placed) return;

    if (pc.snapBack) {
      pc.snapT += dt*4;
      const t = clamp(0,pc.snapT,1);
      pc.x = lerp(pc.snapFrom.x, pc.homeX, t);
      pc.y = lerp(pc.snapFrom.y, pc.homeY, t);
      if (t >= 1) pc.snapBack = false;
    }

    pc.enterTime += dt;
    const et = clamp(0,(pc.enterTime-pc.enterDelay)/0.4,1);
    if (et <= 0) return;
    const scale = easeOutBack(et);
    const wobble = Math.sin(now/1200+pc.wobble)*2;
    const isDrag = pc === dragPiece;

    ctx.save();
    ctx.translate(pc.x, pc.y + wobble + (isDrag?-6:0));
    ctx.rotate(pc.rotation);
    ctx.scale(scale*(isDrag?1.12:1), scale*(isDrag?1.12:1));
    if (isDrag) { ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=12; ctx.shadowOffsetY=6; }
    ctx.fillStyle = pc.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    pc.shape.draw(0, 0, pc.size);
    ctx.restore();
  });
}

function drawHUD() {
  const fs = clamp(14,cw*0.035,24);
  ctx.font = `${fs}px Slackey`;
  ctx.textAlign='left'; ctx.fillStyle='#000'; ctx.fillText(`Score: ${score}`,14,fs+10+2);
  ctx.fillStyle='#FFD700'; ctx.fillText(`Score: ${score}`,12,fs+10);
  ctx.textAlign='right'; ctx.fillStyle='#000'; ctx.fillText(`Level ${level}`,cw-10,fs+10+2);
  ctx.fillStyle='#00D4AA'; ctx.fillText(`Level ${level}`,cw-12,fs+10);
  ctx.textAlign='center';
  const pfs = clamp(10,cw*0.025,16); ctx.font=`${pfs}px Slackey`;
  ctx.fillStyle='#fff'; ctx.fillText(`${filledSlots} / ${totalSlots}`,cw/2,pfs+10);
  if(streak>=2){ctx.fillStyle='#FF69B4';ctx.fillText(`${streak}x streak!`,cw/2,pfs+30);}
}

function drawFeedback(dt) {
  if (feedTimer<=0) return;
  feedTimer -= dt;
  const a = clamp(0,feedTimer/0.3,1), rise=(1-feedTimer/0.6)*30;
  ctx.globalAlpha=a;
  const fs=clamp(22,cw*0.07,44); ctx.font=`${fs}px Slackey`; ctx.textAlign='center';
  ctx.fillStyle='#000'; ctx.fillText(feedText,cw/2+2,ch*0.55-rise+2);
  ctx.fillStyle=feedType==='correct'?'#4ADE80':'#FF6B6B'; ctx.fillText(feedText,cw/2,ch*0.55-rise);
  ctx.globalAlpha=1;
}

function drawParticles(dt) {
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=ch*0.5*dt; p.life-=dt*1.5;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath();
    const s=p.size*p.life;
    for(let j=0;j<5;j++){const a=j*4*Math.PI/5-Math.PI/2;ctx[j===0?'moveTo':'lineTo'](p.x+s*Math.cos(a),p.y+s*Math.sin(a));}
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  }
}

function drawTitle() {
  drawBg();
  const fs=clamp(32,cw*0.1,64); ctx.textAlign='center'; ctx.font=`${fs}px Slackey`;
  ctx.fillStyle='#000'; ctx.fillText('BIZARRE',cw/2+3,ch*0.20+3);
  ctx.fillStyle='#00D4AA'; ctx.fillText('BIZARRE',cw/2,ch*0.20);
  ctx.fillStyle='#000'; ctx.fillText('SHAPES',cw/2+3,ch*0.20+fs+6+3);
  ctx.fillStyle='#FFD700'; ctx.fillText('SHAPES',cw/2,ch*0.20+fs+6);

  // Draw some shapes
  const shapes = [0,1,2,3,4,5];
  shapes.forEach((si,i) => {
    const angle = Date.now()/2000 + i*Math.PI/3;
    const rx = cw/2 + Math.cos(angle)*cw*0.2;
    const ry = ch*0.52 + Math.sin(angle)*ch*0.1;
    ctx.fillStyle = PIECE_COLORS[si]; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    SHAPE_DEFS[si].draw(rx, ry, Math.min(cw,ch)*0.08);
  });

  const sfs=clamp(12,cw*0.03,20); ctx.font=`${sfs}px Slackey`;
  ctx.strokeStyle='#000'; ctx.lineWidth=3;
  ctx.strokeText('A BizarreBeasts Learning Lab Game',cw/2,ch*0.72);
  ctx.fillStyle='#fff'; ctx.fillText('A BizarreBeasts Learning Lab Game',cw/2,ch*0.72);

  const b=1+Math.sin(Date.now()/300)*0.08;
  const tfs=clamp(18,cw*0.05,32)*b; ctx.font=`${tfs}px Slackey`;
  ctx.fillStyle='#000'; ctx.fillText('TAP TO PLAY',cw/2+2,ch*0.88+2);
  ctx.fillStyle='#FFD700'; ctx.fillText('TAP TO PLAY',cw/2,ch*0.88);
}

function drawLevelComplete(dt) {
  drawBg();
  const fs=clamp(28,cw*0.08,52); ctx.textAlign='center'; ctx.font=`${fs}px Slackey`;
  ctx.fillStyle='#000'; ctx.fillText('COMPLETE!',cw/2+3,ch*0.25+3);
  ctx.fillStyle='#4ADE80'; ctx.fillText('COMPLETE!',cw/2,ch*0.25);
  const sfs=clamp(14,cw*0.04,24); ctx.font=`${sfs}px Slackey`;
  ctx.fillStyle='#FFD700'; ctx.fillText(`Score: ${score}`,cw/2,ch*0.38);
  if(level<LEVELS.length){
    const b=1+Math.sin(Date.now()/300)*0.08;
    const tfs=clamp(16,cw*0.04,26)*b; ctx.font=`${tfs}px Slackey`;
    ctx.fillStyle='#000'; ctx.fillText('TAP FOR NEXT LEVEL',cw/2+2,ch*0.72+2);
    ctx.fillStyle='#FFD700'; ctx.fillText('TAP FOR NEXT LEVEL',cw/2,ch*0.72);
  } else {
    const tfs=clamp(16,cw*0.04,26); ctx.font=`${tfs}px Slackey`;
    ctx.fillStyle='#FF69B4'; ctx.fillText('ALL LEVELS COMPLETE!',cw/2,ch*0.72);
    ctx.fillStyle='#fff'; ctx.font=`${tfs*0.7}px Slackey`; ctx.fillText('Tap to play again',cw/2,ch*0.78);
  }
  drawParticles(dt);
}

function drawGameComplete(dt) {
  drawBg();
  const fs=clamp(28,cw*0.08,52); ctx.textAlign='center'; ctx.font=`${fs}px Slackey`;
  ctx.fillStyle='#000'; ctx.fillText('AMAZING!',cw/2+3,ch*0.22+3);
  ctx.fillStyle='#FFD700'; ctx.fillText('AMAZING!',cw/2,ch*0.22);
  const sfs=clamp(16,cw*0.04,28); ctx.font=`${sfs}px Slackey`;
  ctx.fillStyle='#fff'; ctx.fillText(`Final Score: ${score}`,cw/2,ch*0.35);
  const tfs=clamp(14,cw*0.035,22); ctx.font=`${tfs}px Slackey`;
  ctx.fillStyle='#00D4AA'; ctx.fillText('Tap to play again',cw/2,ch*0.75);
  drawParticles(dt);
}

let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts-lastTime)/1000,0.1); lastTime = ts;
  ctx.clearRect(0,0,cw,ch);
  if (gameState==='title') drawTitle();
  else if (gameState==='playing') { drawBg(); drawSlots(); drawPieces(dt); drawFeedback(dt); drawHUD(); drawParticles(dt); }
  else if (gameState==='levelComplete') drawLevelComplete(dt);
  else if (gameState==='gameComplete') drawGameComplete(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
